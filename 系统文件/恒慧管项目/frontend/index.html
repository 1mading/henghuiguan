<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>恒慧管 - 部门内部项目管控系统</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hhg_theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script src="https://g.alicdn.com/dingding/dingtalk-jsapi/3.0.25/dingtalk.open.js"></script>
</head>
<body>
  <div id="app">
    <div id="boot-splash" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg-page,#FAFAF8);color:var(--text-muted,#6B6B6B);font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
      <div style="width:36px;height:36px;border:3px solid var(--brand-soft,#E8EAF5);border-top-color:var(--brand,#3D4A8C);border-radius:50%;animation:hhg-spin .8s linear infinite;"></div>
      <div style="font-size:14px;font-weight:500;color:var(--text,#1A1A1A);">恒慧管加载中…</div>
      <div style="font-size:12px;">首次打开约需几秒，请稍候</div>
    </div>
    <style>@keyframes hhg-spin{to{transform:rotate(360deg)}}</style>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
