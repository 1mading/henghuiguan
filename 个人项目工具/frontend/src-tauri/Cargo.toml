[package]
name = "multi-project-manager"
version = "0.1.0"
description = "棱镜项目工作台 · Prism workbench"
authors = ["Cursor"]
edition = "2021"

[lib]
name = "multi_project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "multi-project-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
